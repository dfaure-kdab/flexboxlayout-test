[package]
name = "flexboxlayout-test"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
slint = { version = "1.17", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia"] }

[build-dependencies]
slint-build = "1.17"

# Use the nightly (master branch) version of Slint; remove this section for the released version
[patch.crates-io]
slint = { git = "https://github.com/slint-ui/slint", branch = "master" }
slint-build = { git = "https://github.com/slint-ui/slint", branch = "master" }

# Stay out of the slint workspace when this directory is nested in a slint checkout
[workspace]
